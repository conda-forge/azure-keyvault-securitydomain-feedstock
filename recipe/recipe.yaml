schema_version: 1

context:
  name: azure-keyvault-securitydomain
  version: "1.0.0b2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/azure_keyvault_securitydomain-${{ version }}.tar.gz
  sha256: 145f8c37efa59a2fb11c3112da1a2abe64463b1f4fcd129a86db8f796e2becee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - azure-core >=1.31.0
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - azure.keyvault.securitydomain
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Microsoft Corporation Azure Keyvault Securitydomain Client Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk

extra:
  recipe-maintainers:
    - janjagusch
