schema_version: 1

context:
  name: azure-keyvault-securitydomain
  version: "1.0.0b3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/azure_keyvault_securitydomain-${{ version }}.tar.gz
  sha256: aa05d7b88de336f906c7d4d535acb16cc6ceb50ee1e95d2a856dcd2410ab9c49

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - azure-core >=1.31.0
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - azure.keyvault.securitydomain
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Microsoft Corporation Azure Keyvault Securitydomain Client Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk

extra:
  recipe-maintainers:
    - janjagusch
